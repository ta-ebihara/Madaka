<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
<link rel="stylesheet" th:href="@{/css/style.css}">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>勤怠連絡システム</title>
</head>
<body>
<div th:replace="header :: header"></div>
  <header class="app-header">
    <div class="app-header__title">勤怠連絡システム</div>
  </header>

  <main class="page">
    <h2 class="section-title">詳細</h2>

    <!-- 登録データ表示フォーム（編集不可） -->
    <form class="form" th:action="@{/madaka/update}" method="post">
      <input type="hidden" name="lateId" th:value="${detailModel.lateId}" />
      <input type="hidden" name="startTime" th:value="${detailModel.startTime}" />

      <label for="date">日付</label>
      <input id="date" type="date" class="input" th:value="${detailModel.date}" disabled />
      <div></div>

      <label for="reason">遅刻理由</label>
      <input id="reason" type="text" class="input" th:value="${detailModel.lateReason}" disabled />
      <div></div>

      <label for="line">路線名</label>
      <input id="line" type="text" class="input" th:value="${detailModel.trainName}" disabled />
      <div></div>

      <label for="delay-min">遅延時間</label>
      <input id="delay-min" type="text" class="input" th:value="|${detailModel.trainDelayMinutes} 分|" disabled />
      <div></div>

      <label for="start-time">始業時間</label>
      <input id="start-time" type="time" class="input" th:value="${detailModel.startTime}" disabled />
      <div></div>

      <label for="late-min">遅刻時間</label>
      <input id="late-min" type="text" class="input" th:value="${detailModel.lateMin}" disabled />
      <div></div>

      <label for="note">備考</label>
      <textarea id="note" class="input" th:text="${detailModel.note}" disabled></textarea>
      <div></div>

      <!-- 更新ボタンと到着ボタン -->
      <div class="actions" style="grid-column: 1 / -1; margin-top: 8px; display: flex; justify-content: center; gap: 12px;">
    <!-- 更新ボタン -->
    <button type="submit" class="btn">更新</button>

    <!-- 到着ボタン -->
    <button type="submit" class="btn" th:formaction="@{/madaka/detail}" formmethod="post">到着</button>
	  </div>
    </form>
  </main>
</body>
</html>
